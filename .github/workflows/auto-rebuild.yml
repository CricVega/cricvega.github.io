name: auto-rebuild

on:
  push:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 20
      - name: Extract koi bhi zip + safai
        continue-on-error: true
        run: |
          rm -f blog.html CNAME || true
          for z in *.zip; do
            [ -e "$z" ] || continue
            python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('.')" "$z" || true
            rm -f "$z" || true
          done
          true
      - name: Build (triple fallback)
        continue-on-error: true
        run: |
          node build.mjs || node build.mjs --no-dynamic || true
      - name: Commit & push
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]" || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || true
          git add -A || true
          git diff --staged --quiet || (git commit -m "auto: live update" && git push) || true
          
